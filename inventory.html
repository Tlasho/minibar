<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minibar Pro • Inventory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --success: #10b981;
            --success-dark: #059669;
            --danger: #ef4444;
            --danger-dark: #dc2626;
            --warning: #f59e0b;
            --background: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-light: rgba(51, 65, 85, 0.3);
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: rgba(71, 85, 105, 0.3);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            --card-shadow-hover: 0 16px 48px rgba(99, 102, 241, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --gradient: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed; /* Prevents iOS bounce */
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 50%);
            -webkit-overflow-scrolling: touch;
            overflow: hidden;
            touch-action: pan-y;
        }

        /* Header */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 120px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        

        .stat-badge {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(10px);
        }

        .stat-badge.rooms {
            color: #60a5fa;
        }

        .stat-badge.total {
            color: var(--success);
        }

        /* Main Container */
        .main-container {
            position: fixed;
            top: 73px; /* Header height */
            left: 0;
            right: 0;
            bottom: 0;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 73px);
        }

        /* Controls */
        .controls-container {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: var(--card-shadow);
            flex-shrink: 0;
        }

        .controls-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .control-button {
            padding: 16px 20px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .control-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255,255,255,0.1), rgba(255,255,255,0));
            opacity: 0;
            transition: var(--transition);
        }

        .control-button:hover::before {
            opacity: 1;
        }

        .control-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--card-shadow-hover);
        }

        .clear-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        /* Inventory List */
        .inventory-list-container {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 24px;
            box-shadow: var(--card-shadow);
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .inventory-list-scroll {
            position: absolute;
            top: 24px;
            left: 24px;
            right: 24px;
            bottom: 24px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        .inventory-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: min-content;
        }

        /* Room Card */
        .room-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            padding: 20px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: pan-y;
        }

        .room-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, 
                rgba(239, 68, 68, 0.1) 0%, 
                rgba(239, 68, 68, 0.2) 100%);
            transition: width 0.3s ease;
            z-index: 1;
        }

        .room-card.swiping-red::before {
            width: 100%;
            background: linear-gradient(90deg, 
                rgba(239, 68, 68, 0.2) 0%, 
                rgba(239, 68, 68, 0.4) 100%);
        }

        .room-card.swiping-green::before {
            width: 100%;
            background: linear-gradient(90deg, 
                rgba(16, 185, 129, 0.2) 0%, 
                rgba(16, 185, 129, 0.4) 100%);
        }

        .room-card.completed {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .room-card.pending {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .room-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
            z-index: 2;
        }

        .room-number {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .room-number.completed {
            color: var(--success);
        }

        .room-number.pending {
            color: #fca5a5;
        }

        .room-number .badge {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .room-number.completed .badge {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .room-number.pending .badge {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .room-content {
            position: relative;
            z-index: 2;
        }

        .product-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .product-tag {
            background: rgba(30, 41, 59, 0.6);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(71, 85, 105, 0.3);
            transition: var(--transition);
        }

        .product-tag:hover {
            transform: translateY(-1px);
            border-color: var(--primary);
        }

        .room-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .room-time {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .room-price {
            font-weight: 600;
            color: var(--success);
            font-size: 14px;
        }

        /* Swipe Feedback */
        .swipe-feedback {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 24px;
            font-size: 16px;
            font-weight: 700;
            opacity: 0;
            transform: translateX(-20px);
            transition: var(--transition);
            z-index: 3;
            pointer-events: none;
        }

        .swipe-feedback.complete {
            color: var(--success);
        }

        .swipe-feedback.pending {
            color: var(--danger);
        }

        .room-card.swiping-green .swipe-feedback.complete {
            opacity: 1;
            transform: translateX(0);
        }

        .room-card.swiping-red .swipe-feedback.pending {
            opacity: 1;
            transform: translateX(0);
        }

        .swipe-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: var(--danger);
            border-radius: 0 0 18px 18px;
            width: 0%;
            transition: width 0.2s ease;
            z-index: 3;
        }

        .room-card.swiping-green .swipe-progress {
            background: var(--success);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        .empty-subtitle {
            font-size: 14px;
            max-width: 300px;
            margin: 0 auto;
        }

        /* Delete Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            touch-action: none;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 32px;
            max-width: 400px;
            width: 90%;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .modal-icon {
            font-size: 48px;
            color: var(--danger);
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text);
        }

        .modal-message {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.5;
        }

        .modal-room {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            margin: 20px 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--danger);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            touch-action: manipulation;
            -webkit-tap-highlight-color: rgba(255, 255, 255, 0.1);
        }

        .modal-btn.cancel {
            background: rgba(71, 85, 105, 0.3);
            color: var(--text);
        }

        .modal-btn.cancel:hover {
            background: rgba(71, 85, 105, 0.5);
            transform: translateY(-2px);
        }

        .modal-btn.confirm {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        .modal-btn.confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.3);
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 90px;
            right: 20px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            border-radius: 14px;
            border: 1px solid var(--border);
            padding: 16px 20px;
            font-size: 14px;
            font-weight: 600;
            z-index: 2000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transform: translateX(100%);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
            max-width: 300px;
        }

        .notification.show {
            transform: translateX(0);
            opacity: 1;
        }

        .notification.success {
            border-left: 4px solid var(--success);
        }

        .notification.error {
            border-left: 4px solid var(--danger);
        }

        .notification.info {
            border-left: 4px solid var(--primary);
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(20px);
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        @keyframes shimmer {
            0% { background-position: -200px 0; }
            100% { background-position: calc(200px + 100%) 0; }
        }

        .pulse {
            animation: pulse 0.3s ease;
        }

        /* Hold to Delete Indicator */
        .hold-hint {
            position: absolute;
            bottom: 8px;
            left: 8px;
            font-size: 10px;
            color: var(--text-secondary);
            background: rgba(30, 41, 59, 0.7);
            padding: 3px 8px;
            border-radius: 8px;
            z-index: 2;
            opacity: 0.6;
        }

        /* Room Actions */
        .room-actions {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 2;
        }

        

        .room-action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: var(--text);
            transform: scale(1.1);
        }

        /* Responsive */
        @media (max-width: 200px) {
            .app-header {
                padding:112px 116px;
            }
            
            
            
            .main-container {
                padding: 16px;
                top: 68px;
                height: calc(100vh - 68px);
            }
            
            .room-card {
                padding: 16px;
            }
            
            .room-number {
                font-size: 18px;
            }
            
            .product-tag {
                font-size: 12px;
                padding: 4px 8px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* Back Button */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 10px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1001;
            transition: var(--transition);
            touch-action: manipulation;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-2px);
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <!-- Back Button -->
    <a href="main.html" class="back-button">
        <i class="fas fa-arrow-left"></i>
        <span>უკან</span>
    </a>

    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            
        </div>
        <div class="header-stats">
            <div class="stat-badge rooms">
                <i class="fas fa-door-closed"></i>
                <span id="roomCount">0 ოთახი</span>
            </div>
            <div class="stat-badge total">
                <i class="fas fa-money-bill-wave"></i>
                <span id="totalPriceAmount">₾0.00</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <!-- Controls -->
        <div class="controls-container">
            
            <div class="controls-grid">
                <button class="control-button clear-btn" id="clearButton">
                    <i class="fas fa-trash-alt"></i>
                    <span>გასუფთავება</span>
                </button>
            </div>
        </div>

        <!-- Inventory List -->
        <div class="inventory-list-container">
            <div class="inventory-list-scroll" id="inventoryListScroll">
                <div class="inventory-list" id="inventoryList">
                    <!-- Rooms will be loaded here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-icon">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <h3 class="modal-title">ოთახის წაშლა</h3>
                <p class="modal-message">ნამდვილად გსურთ წაშალოთ ოთახი?</p>
            </div>
            <div class="modal-room" id="deleteRoomNumber">ოთახი 101</div>
            <div class="modal-actions">
                <button class="modal-btn cancel" id="cancelDelete">გაუქმება</button>
                <button class="modal-btn confirm" id="confirmDelete">წაშლა</button>
            </div>
        </div>
    </div>

    <!-- Notification Container -->
    <div id="notificationContainer"></div>

    <script>
        // Product price mapping
        const PRODUCT_PRICES = {
            '4001': 4.72, '4002': 6.49, '4003': 7.08, '4004': 15.34,
            '4005': 27.14, '4006': 9.44, '4007': 20.00, '4008': 23.60,
            '4009': 17.70, '4010': 150.00, '4011': 15.34, '4012': 15.34,
            '4013': 25.96, '4014': 59.00, '4015': 47.20, '4016': 49.56,
            '4017': 43.66, '4018': 37.76, '4019': 20.00, '4021': 10.62,
            '4022': 9.44, '4023': 2.95, '4024': 11.80, '4027': 8.26,
            '4028': 7.50, '1': 7.08, '2': 15.34, '3': 10.62, '4': 9.44,
            '5': 11.80, '7': 4.72, '8': 15.34, '9': 9.44, '10': 6.49,
            '11': 37.76, '12': 49.56, '13': 43.66, '14': 20.00, '15': 150.00,
            '30': 2.95, '31': 7.50, '32': 8.26, '40': 25.96, '41': 17.70,
            '42': 23.60, '43': 47.20, '44': 27.14, '45': 20.00, '46': 59.00,
            '100': 55, '101': 65
        };

        // Product sorting order
        const PRODUCT_SORT_ORDER = {
            '14': 1, '4019': 1, '41': 2, '4009': 2, '42': 3, '4008': 3,
            '44': 4, '4005': 4, '43': 5, '4015': 5, '45': 6, '4007': 6,
            '46': 7, '4014': 7, '40': 8, '4013': 8, '11': 9, '4018': 9,
            '12': 10, '4016': 10, '13': 11, '4017': 11, '15': 12, '4010': 12,
            '8': 13, '4011': 13, '9': 14, '4006': 14, '30': 15, '4023': 15,
            '4': 16, '4022': 16, '3': 17, '4021': 17, '7': 18, '4001': 18,
            '10': 19, '4002': 19, '1': 20, '4003': 20, '2': 21, '4004': 21,
            '32': 22, '4027': 22, '31': 23, '4028': 23, '5': 24, '4024': 24,
            '100': 25, '101': 26
        };

        // Enhanced Inventory Manager
        class InventoryManager {
            static getAllInventory() {
                const inventory = localStorage.getItem('minibarInventory');
                return inventory ? JSON.parse(inventory) : {};
            }

            static getMarkedRooms() {
                const markedRooms = localStorage.getItem('markedRooms');
                return markedRooms ? JSON.parse(markedRooms) : [];
            }

            static getRedRooms() {
                const redRooms = localStorage.getItem('redRooms');
                return redRooms ? JSON.parse(redRooms) : [];
            }

            static markRoom(roomNumber, type = 'green') {
                if (type === 'green') {
                    const markedRooms = this.getMarkedRooms();
                    const redRooms = this.getRedRooms();
                    
                    if (!markedRooms.includes(roomNumber)) {
                        markedRooms.push(roomNumber);
                        localStorage.setItem('markedRooms', JSON.stringify(markedRooms));
                    }
                    
                    const redIndex = redRooms.indexOf(roomNumber);
                    if (redIndex > -1) {
                        redRooms.splice(redIndex, 1);
                        localStorage.setItem('redRooms', JSON.stringify(redRooms));
                    }
                } else if (type === 'red') {
                    const redRooms = this.getRedRooms();
                    const markedRooms = this.getMarkedRooms();
                    
                    if (!redRooms.includes(roomNumber)) {
                        redRooms.push(roomNumber);
                        localStorage.setItem('redRooms', JSON.stringify(redRooms));
                    }
                    
                    const greenIndex = markedRooms.indexOf(roomNumber);
                    if (greenIndex > -1) {
                        markedRooms.splice(greenIndex, 1);
                        localStorage.setItem('markedRooms', JSON.stringify(markedRooms));
                    }
                }
                return true;
            }

            static unmarkRoom(roomNumber) {
                const markedRooms = this.getMarkedRooms();
                const redRooms = this.getRedRooms();
                
                const greenIndex = markedRooms.indexOf(roomNumber);
                if (greenIndex > -1) {
                    markedRooms.splice(greenIndex, 1);
                    localStorage.setItem('markedRooms', JSON.stringify(markedRooms));
                }
                
                const redIndex = redRooms.indexOf(roomNumber);
                if (redIndex > -1) {
                    redRooms.splice(redIndex, 1);
                    localStorage.setItem('redRooms', JSON.stringify(redRooms));
                }
                return true;
            }

            static isRoomMarked(roomNumber) {
                const markedRooms = this.getMarkedRooms();
                const redRooms = this.getRedRooms();
                if (markedRooms.includes(roomNumber)) return 'green';
                if (redRooms.includes(roomNumber)) return 'red';
                return false;
            }

            static deleteRoom(roomNumber) {
                // Remove from inventory
                const allInventory = this.getAllInventory();
                if (allInventory[roomNumber]) {
                    delete allInventory[roomNumber];
                    localStorage.setItem('minibarInventory', JSON.stringify(allInventory));
                }
                
                // Remove from marked rooms
                this.unmarkRoom(roomNumber);
                
                return true;
            }

            static clearAll() {
                localStorage.setItem('minibarInventory', JSON.stringify({}));
                localStorage.setItem('markedRooms', JSON.stringify([]));
                localStorage.setItem('redRooms', JSON.stringify([]));
                return true;
            }

            static getAllRoomsSummary() {
                const allInventory = this.getAllInventory();
                const markedRooms = this.getMarkedRooms();
                const redRooms = this.getRedRooms();
                const summaries = [];
                let totalProducts = 0;
                let totalPrice = 0;
                
                Object.keys(allInventory).forEach(roomNumber => {
                    const roomInventory = allInventory[roomNumber];
                    const products = roomInventory.products || {};
                    const productItems = [];
                    let roomProductCount = 0;
                    let roomPrice = 0;
                    
                    Object.keys(products).forEach(productId => {
                        const product = products[productId];
                        if (product.count > 0) {
                            const productPrice = PRODUCT_PRICES[productId] || 0;
                            const productTotalPrice = productPrice * product.count;
                            roomPrice += productTotalPrice;
                            
                            productItems.push({
                                id: productId,
                                name: product.name,
                                count: product.count,
                                price: productPrice,
                                totalPrice: productTotalPrice,
                                sortOrder: PRODUCT_SORT_ORDER[productId] || 999
                            });
                            
                            roomProductCount += product.count;
                        }
                    });
                    
                    productItems.sort((a, b) => a.sortOrder - b.sortOrder);
                    
                    if (productItems.length > 0) {
                        totalProducts += roomProductCount;
                        totalPrice += roomPrice;
                        
                        let status = 'none';
                        if (markedRooms.includes(roomNumber)) status = 'green';
                        else if (redRooms.includes(roomNumber)) status = 'red';
                        
                        summaries.push({
                            room: roomNumber,
                            products: productItems,
                            totalCount: roomProductCount,
                            totalPrice: roomPrice,
                            status: status,
                            lastUpdated: roomInventory.lastUpdated || new Date().toISOString(),
                            timestamp: new Date(roomInventory.lastUpdated || new Date()).getTime()
                        });
                    }
                });
                
                // Always sort by date (newest first) and status
                const sortedSummaries = summaries.sort((a, b) => {
                    const statusOrder = { 'none': 0, 'red': 1, 'green': 2 };
                    if (statusOrder[a.status] !== statusOrder[b.status]) {
                        return statusOrder[a.status] - statusOrder[b.status];
                    }
                    return b.timestamp - a.timestamp;
                });
                
                return {
                    summaries: sortedSummaries,
                    totalProducts,
                    totalPrice
                };
            }
        }

        // UI Manager
        class UIManager {
            constructor() {
                this.inventoryList = document.getElementById('inventoryList');
                this.inventoryListScroll = document.getElementById('inventoryListScroll');
                this.clearButton = document.getElementById('clearButton');
                this.roomCount = document.getElementById('roomCount');
                this.totalPriceAmount = document.getElementById('totalPriceAmount');
                this.deleteModal = document.getElementById('deleteModal');
                this.deleteRoomNumber = document.getElementById('deleteRoomNumber');
                this.cancelDelete = document.getElementById('cancelDelete');
                this.confirmDelete = document.getElementById('confirmDelete');
                
                this.roomToDelete = null;
                this.holdTimer = null;
                this.HOLD_DURATION = 800; // Reduced for iPhone
                this.isScrolling = false;
                this.scrollStartY = 0;
                this.touchStartTime = 0;
                
                this.init();
            }
            
            init() {
                this.loadInventory();
                this.setupEventListeners();
                setInterval(() => this.loadInventory(), 10000);
            }
            
            loadInventory() {
                const result = InventoryManager.getAllRoomsSummary();
                const { summaries, totalProducts, totalPrice } = result;
                
                this.inventoryList.innerHTML = '';
                
                if (summaries.length === 0) {
                    this.inventoryList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">
                                <i class="fas fa-inbox"></i>
                            </div>
                            <h3 class="empty-title">ინვენტარი ცარიელია</h3>
                            <p class="empty-subtitle">დაამატეთ პროდუქტები ოთახებში რომ დაიწყოთ</p>
                        </div>
                    `;
                    this.roomCount.textContent = '0 ოთახი';
                    this.totalPriceAmount.textContent = '₾0.00';
                    return;
                }
                
                this.roomCount.textContent = `${summaries.length} ოთახი`;
                this.totalPriceAmount.textContent = `₾${totalPrice.toFixed(2)}`;
                
                summaries.forEach(item => {
                    const roomCard = this.createRoomCard(item);
                    this.inventoryList.appendChild(roomCard);
                });
            }
            
            createRoomCard(item) {
                const card = document.createElement('div');
                const statusClass = item.status === 'green' ? 'completed' : item.status === 'red' ? 'pending' : '';
                
                card.className = `room-card ${statusClass}`;
                card.setAttribute('data-room', item.room);
                
                const productTags = item.products.map(product => `
                    <span class="product-tag">
                        ${product.count}  ${product.name}
                    </span>
                `).join('');
                
                const lastUpdated = new Date(item.lastUpdated);
                const formattedTime = this.formatTime(lastUpdated);
                
                card.innerHTML = `
                    <div class="swipe-feedback complete">
                        <i class="fas fa-check-circle"></i>
                        <span>შევსებული</span>
                    </div>
                    <div class="swipe-feedback pending">
                        <i class="fas fa-clock"></i>
                        <span>მოლოდინში</span>
                    </div>
                    <div class="swipe-progress"></div>
                    
                    
                    <div class="room-card-header">
                        <div class="room-number ${statusClass}">
                            <i class="fas fa-door-closed"></i>
                            ოთახი ${item.room}
                            ${statusClass ? `<span class="badge">${statusClass === 'completed' ? 'დასრულებული' : 'შევსებული'}</span>` : ''}
                        </div>
                        <div class="room-actions">
                            <div class="room-action-btn delete-btn" title="წაშლა">
                                
                            </div>
                        </div>
                    </div>
                    
                    <div class="room-content">
                        <div class="product-tags">
                            ${productTags}
                        </div>
                        <div class="room-meta">
                            <div class="room-time">
                                <i class="far fa-clock"></i>
                                <span>${formattedTime}</span>
                                <span>•</span>
                                <span>${item.totalCount} პროდუქტი</span>
                            </div>
                            <div class="room-price">₾${item.totalPrice.toFixed(2)}</div>
                        </div>
                    </div>
                `;
                
                this.setupCardEvents(card, item.room);
                return card;
            }
            
            setupCardEvents(card, roomNumber) {
                let touchStartX = 0;
                let touchStartY = 0;
                let touchEndX = 0;
                let touchEndY = 0;
                let isSwiping = false;
                let isVerticalScroll = false;
                let scrollThreshold = 5;
                let swipeThreshold = 30;
                
                // Delete button
                const deleteBtn = card.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    this.openDeleteModal(roomNumber);
                });
                
                // Prevent text selection on iOS
                card.addEventListener('touchstart', (e) => {
                    if (e.touches.length > 1) return;
                    
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    this.touchStartTime = Date.now();
                    isSwiping = false;
                    isVerticalScroll = false;
                    
                    // Store initial scroll position
                    this.scrollStartY = this.inventoryListScroll.scrollTop;
                    
                    // Start hold timer for delete
                    this.holdTimer = setTimeout(() => {
                        if (!isSwiping && !this.isScrolling) {
                            this.vibrate(50);
                            card.classList.add('pulse');
                            this.openDeleteModal(roomNumber);
                        }
                    }, this.HOLD_DURATION);
                    
                    e.stopPropagation();
                }, { passive: false });
                
                card.addEventListener('touchmove', (e) => {
                    if (!touchStartX || e.touches.length > 1) return;
                    
                    touchEndX = e.touches[0].clientX;
                    touchEndY = e.touches[0].clientY;
                    const deltaX = touchEndX - touchStartX;
                    const deltaY = touchEndY - touchStartY;
                    
                    // Check if scrolling is happening in the container
                    const currentScrollY = this.inventoryListScroll.scrollTop;
                    const scrollDelta = Math.abs(currentScrollY - this.scrollStartY);
                    
                    if (scrollDelta > 5) {
                        this.isScrolling = true;
                        clearTimeout(this.holdTimer);
                        this.holdTimer = null;
                        return;
                    }
                    
                    // Cancel hold timer if moving
                    if (Math.abs(deltaX) > 10 || Math.abs(deltaY) > 10) {
                        clearTimeout(this.holdTimer);
                        this.holdTimer = null;
                    }
                    
                    // Vertical scroll detection
                    if (!isSwiping && Math.abs(deltaY) > scrollThreshold) {
                        isVerticalScroll = true;
                        this.isScrolling = true;
                        return;
                    }
                    
                    // Horizontal swipe detection
                    if (!isVerticalScroll && Math.abs(deltaX) > swipeThreshold && Math.abs(deltaX) > Math.abs(deltaY)) {
                        isSwiping = true;
                        e.preventDefault();
                        
                        const currentStatus = InventoryManager.isRoomMarked(roomNumber);
                        
                        if (deltaX > 0) {
                            // Swipe right
                            card.classList.remove('swiping-red');
                            card.classList.add('swiping-green');
                            
                            const progress = Math.min(Math.abs(deltaX) / 150, 1);
                            const progressBar = card.querySelector('.swipe-progress');
                            progressBar.style.width = `${progress * 100}%`;
                            card.style.transform = `translateX(${Math.min(deltaX * 0.5, 75)}px)`;
                        } else {
                            // Swipe left
                            card.classList.remove('swiping-green', 'swiping-red');
                            const progress = Math.min(Math.abs(deltaX) / 150, 1);
                            const progressBar = card.querySelector('.swipe-progress');
                            progressBar.style.width = `${progress * 100}%`;
                            progressBar.style.background = '#94a3b8';
                            card.style.transform = `translateX(${Math.max(deltaX * 0.5, -75)}px)`;
                        }
                    }
                }, { passive: false });
                
                card.addEventListener('touchend', (e) => {
                    clearTimeout(this.holdTimer);
                    this.holdTimer = null;
                    
                    if (!touchStartX) return;
                    
                    const touchDuration = Date.now() - this.touchStartTime;
                    const deltaX = touchEndX - touchStartX;
                    
                    // Reset styles
                    card.classList.remove('swiping-red', 'swiping-green', 'pulse');
                    card.style.transform = '';
                    const progressBar = card.querySelector('.swipe-progress');
                    progressBar.style.width = '0%';
                    progressBar.style.background = '';
                    
                    // Handle swipe if not scrolling
                    if (isSwiping && !this.isScrolling && Math.abs(deltaX) > 100) {
                        e.preventDefault();
                        this.handleSwipe(roomNumber, deltaX > 0, card);
                    }
                    
                    // Reset
                    touchStartX = 0;
                    touchStartY = 0;
                    touchEndX = 0;
                    touchEndY = 0;
                    isSwiping = false;
                    isVerticalScroll = false;
                    this.isScrolling = false;
                });
                
                // Prevent context menu on long press
                card.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    return false;
                });
            }
            
            handleSwipe(roomNumber, isRightSwipe, card) {
                const currentStatus = InventoryManager.isRoomMarked(roomNumber);
                
                if (isRightSwipe) {
                    if (currentStatus === 'green') {
                        this.showNotification(`ოთახი ${roomNumber} უკვე დასრულებულია`, 'success');
                    } else if (currentStatus === 'red') {
                        InventoryManager.markRoom(roomNumber, 'green');
                        this.showNotification(`ოთახი ${roomNumber} დასრულებულია`, 'success');
                    } else {
                        InventoryManager.markRoom(roomNumber, 'red');
                        this.showNotification(`ოთახი ${roomNumber} შევსებულია`, 'error');
                    }
                } else {
                    // Swipe left - undo
                    if (currentStatus) {
                        InventoryManager.unmarkRoom(roomNumber);
                        this.showNotification(`ოთახი ${roomNumber} შესავსებია`, 'info');
                    }
                }
                
                this.vibrate(30);
                setTimeout(() => this.loadInventory(), 300);
            }
            
            openDeleteModal(roomNumber) {
                this.roomToDelete = roomNumber;
                this.deleteRoomNumber.textContent = `ოთახი ${roomNumber}`;
                this.deleteModal.classList.add('active');
            }
            
            closeDeleteModal() {
                this.deleteModal.classList.remove('active');
                this.roomToDelete = null;
            }
            
            formatTime(date) {
                const hours = date.getHours().toString().padStart(2, '0');
                const minutes = date.getMinutes().toString().padStart(2, '0');
                return `${hours}:${minutes}`;
            }
            
            showNotification(message, type = 'info') {
                const container = document.getElementById('notificationContainer');
                const notification = document.createElement('div');
                notification.className = `notification ${type}`;
                notification.innerHTML = `
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                    <span>${message}</span>
                `;
                
                container.appendChild(notification);
                
                setTimeout(() => {
                    notification.classList.add('show');
                }, 10);
                
                setTimeout(() => {
                    notification.classList.remove('show');
                    setTimeout(() => {
                        if (notification.parentNode) {
                            notification.parentNode.removeChild(notification);
                        }
                    }, 300);
                }, 3000);
            }
            
            vibrate(duration) {
                if (navigator.vibrate) {
                    navigator.vibrate(duration);
                }
            }
            
            setupEventListeners() {
                // Clear button
                this.clearButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm('დარწმუნებული ხარ? ყველა ოთახი წაიშლება!')) {
                        InventoryManager.clearAll();
                        this.loadInventory();
                        this.showNotification('ინვენტარი გასუფთავდა', 'success');
                        this.vibrate(100);
                    }
                });
                
                // Delete modal buttons
                this.cancelDelete.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.closeDeleteModal();
                });
                
                this.confirmDelete.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (this.roomToDelete) {
                        InventoryManager.deleteRoom(this.roomToDelete);
                        this.showNotification(`ოთახი ${this.roomToDelete} წაიშალა`, 'error');
                        this.vibrate(100);
                        this.loadInventory();
                    }
                    this.closeDeleteModal();
                });
                
                // Close modal on outside click
                this.deleteModal.addEventListener('click', (e) => {
                    if (e.target === this.deleteModal) {
                        this.closeDeleteModal();
                    }
                });
                
                // Handle scrolling
                this.inventoryListScroll.addEventListener('scroll', () => {
                    this.isScrolling = true;
                    clearTimeout(this.holdTimer);
                    this.holdTimer = null;
                });
                
                // Reset scrolling flag
                this.inventoryListScroll.addEventListener('touchend', () => {
                    setTimeout(() => {
                        this.isScrolling = false;
                    }, 100);
                });
            }
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            const uiManager = new UIManager();
            
            // Prevent text selection on iOS
            document.addEventListener('selectstart', (e) => {
                e.preventDefault();
                return false;
            });
            
            // Prevent zoom
            document.addEventListener('touchstart', (e) => {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });
            
            // Prevent iOS bounce
            document.addEventListener('touchmove', (e) => {
                if (!e.target.closest('.inventory-list-scroll')) {
                    e.preventDefault();
                }
            }, { passive: false });
            
            // Prevent context menu
            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                return false;
            });
            
            // Prevent double tap zoom
            let lastTouchEnd = 0;
            document.addEventListener('touchend', (e) => {
                const now = Date.now();
                if (now - lastTouchEnd <= 300) {
                    e.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
        });
    </script>
</body>
